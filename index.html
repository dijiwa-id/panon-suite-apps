<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panon Suite Apps | BETA</title>
    <script>
      (function() {
        try {
          var stateItem = localStorage.getItem('panon-suite-storage');
          var theme = 'dark';
          if (stateItem) {
            var parsed = JSON.parse(stateItem);
            if (parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
