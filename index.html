<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panon Suite Apps | BETA</title>
    <script>
      (function() {
        const originalError = console.error;
        console.error = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('Hydration')) return;
          originalError.apply(console, args);
        };
        const originalLog = console.log;
        console.log = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('[vite] connecting') || msg.includes('[vite] connected')) return;
          originalLog.apply(console, args);
        };
        const originalWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('Hydration')) return;
          originalWarn.apply(console, args);
        };
        
        window.addEventListener('error', function(e) {
          if (e.message === 'Script error.' || e.message?.includes('websocket') || e.message?.includes('Hydration')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason?.message?.includes('websocket') || e.reason?.includes?.('websocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
      
      (function() {
        try {
          var stateItem = localStorage.getItem('panon-suite-storage');
          var theme = 'dark';
          if (stateItem) {
            var parsed = JSON.parse(stateItem);
            if (parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
